<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

<header style="padding: 20px; text-align: center;">

<div class="gallery-container">

            <video src="{{ url_for('static', filename='images/gallery/video1.webm') }}" muted loop playsinline></video>

        </div>
        
        </div>

<div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <span class="close-lightbox">&times;</span>
    <div id="lightbox-media-container" onclick="event.stopPropagation()">
        </div>
</div>

<script>

</script>
